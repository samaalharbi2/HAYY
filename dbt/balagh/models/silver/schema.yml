version: 2

models:
  - name: silver_service_requests
    description: >
      One row per 940 service request. Combines all quarters, removes embedded
      header rows, and resolves the two source layouts (A and B).
    columns:
      - name: request_sk
        description: "Surrogate key: md5(file_sha256 + source_row_number). The source has no request ID."
        data_tests: [unique, not_null]
      - name: source_layout
        description: "A = standard layout. B = Q2 layout where status is not published."
        data_tests:
          - accepted_values:
              arguments:
                values: ["A", "B"]
      - name: status_code
        description: "completed / in_progress / not_published (layout B). 'unknown' must never appear."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["completed", "in_progress", "not_published"]
      - name: repeat_flag_ar
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["مكرر", "غير مكرر"]
      - name: time_band
        description: "6-hour band from layout B. Meaning inferred (likely the received time)."
        data_tests:
          - accepted_values:
              arguments:
                values: ["00:00 06:00", "06:00 12:00", "12:00 18:00", "18:00 00:00"]
      - name: issue_type_ar
        data_tests: [not_null]
      - name: location_ar
        description: "Arabic location. NULL is kept and flagged with is_location_missing."
        data_tests:
          - not_null:
              config:
                warn_if: ">0"
                error_if: ">100"
      - name: is_location_missing
        description: "True when the source file has no location for this request."
      - name: received_date
        data_tests: [not_null]
